{% extends "base.html" %}
{% block content %}
<div class="page-header split"><div><div class="eyebrow">Apache VHost</div><h1>{{ file }}</h1><p class="muted">Backup → Syntaxprüfung → graceful reload; bei Fehler Rollback.</p></div><a class="btn" href="/vhosts">Zurück</a></div>
<form method="post" action="/vhosts/save" class="stack"><input type="hidden" name="file" value="{{ file }}"><textarea name="content" spellcheck="false">{{ content }}</textarea><div class="toolbar"><button class="btn btn-primary" type="submit">Speichern & prüfen</button><a class="btn btn-ghost" href="/vhosts">Abbrechen</a></div></form>
{% endblock %}
