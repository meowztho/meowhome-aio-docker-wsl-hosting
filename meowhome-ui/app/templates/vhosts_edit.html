{% extends "base.html" %}
{% block content %}
<div class="page-header"><div><div class="eyebrow">Apache VHost</div><h1>{{ file }}</h1><p class="muted">Änderungen werden erst geprüft und als Diff angezeigt.</p></div><a class="btn" href="/vhosts">Zurück</a></div>
<div class="card"><form method="post" action="/vhosts/preview" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}"><input type="hidden" name="file" value="{{ file }}"><input type="hidden" name="revision" value="{{ revision }}"><div class="field"><label>Apache-Konfiguration</label><textarea name="content" spellcheck="false" required rows="20">{{ content }}</textarea></div><div class="toolbar"><button class="btn btn-primary" type="submit">Änderungen prüfen</button><a class="btn" href="/vhosts">Abbrechen</a></div></form></div>
{% endblock %}
