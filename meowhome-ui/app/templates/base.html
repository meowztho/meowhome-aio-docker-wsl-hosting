<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>{{ title if title else "MeowHome" }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d14;
      --panel: #101722;
      --panel-2: #151f2d;
      --panel-3: #1b2737;
      --border: #273548;
      --border-strong: #3b4c63;
      --text: #e8eef7;
      --muted: #8fa0b7;
      --primary: #73b7ff;
      --primary-strong: #3192f5;
      --success: #45d39a;
      --warning: #f4bd62;
      --danger: #ff6b78;
      --shadow: 0 18px 45px rgba(0,0,0,.22);
      --code: #070b10;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #eef3f8;
      --panel: #ffffff;
      --panel-2: #f6f8fb;
      --panel-3: #eaf0f6;
      --border: #d8e0ea;
      --border-strong: #bcc9d8;
      --text: #182230;
      --muted: #607086;
      --primary: #1769aa;
      --primary-strong: #0b72c9;
      --success: #137c57;
      --warning: #9a6510;
      --danger: #b82f42;
      --shadow: 0 16px 38px rgba(24,34,48,.10);
      --code: #111923;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.48;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 238px minmax(0,1fr); }
    .sidebar {
      position: sticky; top: 0; height: 100vh;
      padding: 22px 16px;
      border-right: 1px solid var(--border);
      background: linear-gradient(180deg, var(--panel), color-mix(in srgb, var(--panel) 82%, var(--bg)));
    }
    .brand { display: flex; align-items: center; gap: 11px; margin: 2px 8px 24px; }
    .brand-mark {
      display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary-strong), #7657e8); color: white; font-weight: 800;
      box-shadow: var(--shadow);
    }
    .brand strong { display: block; font-size: 16px; }
    .brand span { display: block; color: var(--muted); font-size: 12px; }
    .nav { display: grid; gap: 5px; }
    .nav a {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px;
      color: var(--muted); font-weight: 650; border: 1px solid transparent;
    }
    .nav a:hover { color: var(--text); background: var(--panel-2); border-color: var(--border); text-decoration: none; }
    .sidebar-footer { position: absolute; left: 16px; right: 16px; bottom: 18px; }
    .main { min-width: 0; }
    .topbar {
      min-height: 64px; padding: 12px clamp(18px, 3vw, 36px); border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: flex-end; gap: 10px; position: sticky; top: 0; z-index: 10;
    }
    .content { padding: 28px clamp(18px, 3vw, 38px) 48px; max-width: 1500px; margin: 0 auto; }
    .page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 22px; }
    .page-header h1, .page-header h2 { margin: 0 0 5px; font-size: clamp(25px, 3vw, 34px); letter-spacing: -.03em; }
    h2 { margin: 0 0 18px; } h3 { margin: 0 0 12px; font-size: 17px; } h4 { margin: 0 0 9px; }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); }
    .eyebrow { color: var(--primary); text-transform: uppercase; font-size: 11px; font-weight: 800; letter-spacing: .12em; }
    .grid { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 16px; }
    .col-12 { grid-column: span 12; } .col-8 { grid-column: span 8; } .col-7 { grid-column: span 7; } .col-6 { grid-column: span 6; } .col-5 { grid-column: span 5; } .col-4 { grid-column: span 4; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px;
      box-shadow: var(--shadow); min-width: 0;
    }
    .card + .card { margin-top: 0; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 14px; }
    .card-title { margin: 0; font-size: 17px; }
    .stack { display: grid; gap: 12px; }
    .stack-lg { display: grid; gap: 18px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .split { display: flex; justify-content: space-between; gap: 14px; align-items: center; flex-wrap: wrap; }
    .kpi { font-size: 28px; font-weight: 760; letter-spacing: -.03em; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px; border: 1px solid var(--border);
      border-radius: 999px; background: var(--panel-2); color: var(--muted); font-size: 12px; font-weight: 700;
    }
    .badge.ok { color: var(--success); border-color: color-mix(in srgb, var(--success) 40%, var(--border)); }
    .badge.warn { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 40%, var(--border)); }
    .badge.error { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); }
    .notice { border-left: 3px solid var(--primary-strong); background: var(--panel-2); border-radius: 9px; padding: 12px 14px; }
    .notice.warning { border-left-color: var(--warning); }
    .notice.danger { border-left-color: var(--danger); }
    label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; color: color-mix(in srgb, var(--text) 86%, var(--muted)); }
    input, textarea, select, button, .btn {
      font: inherit; border-radius: 9px; border: 1px solid var(--border-strong); color: var(--text);
    }
    input, textarea, select { width: 100%; padding: 9px 11px; background: var(--panel-2); }
    input[type="checkbox"], input[type="radio"] { width: auto; accent-color: var(--primary-strong); }
    textarea { min-height: 520px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    button, .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 11px;
      background: var(--panel-3); cursor: pointer; font-weight: 720; text-decoration: none;
    }
    button:hover, .btn:hover { border-color: var(--primary); text-decoration: none; }
    .btn-primary { background: var(--primary-strong); border-color: var(--primary-strong); color: white; }
    .btn-danger { color: var(--danger); }
    .btn-ghost { background: transparent; }
    .btn-sm { padding: 6px 9px; font-size: 12px; }
    .field { margin-bottom: 13px; }
    .check-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 8px; }
    .check-item { display: flex; gap: 8px; align-items: center; padding: 9px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--panel-2); }
    .check-item label { margin: 0; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid var(--border); padding: 10px 9px; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
    tr:last-child td { border-bottom: 0; }
    pre { margin: 0; padding: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--code); color: #dce7f4; overflow: auto; }
    code { background: var(--panel-2); border: 1px solid var(--border); padding: 1px 5px; border-radius: 5px; }
    details > summary { cursor: pointer; font-weight: 720; }
    hr { border: 0; border-top: 1px solid var(--border); margin: 18px 0; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    @media (max-width: 960px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; padding: 12px 16px; border-right: 0; border-bottom: 1px solid var(--border); }
      .brand { margin: 0 0 10px; }
      .nav { display: flex; overflow-x: auto; padding-bottom: 2px; }
      .nav a { white-space: nowrap; }
      .sidebar-footer { position: static; margin-top: 10px; }
      .topbar { display: none; }
      .col-8, .col-7, .col-6, .col-5, .col-4 { grid-column: span 12; }
    }
    @media (max-width: 640px) {
      .content { padding: 20px 14px 36px; }
      .card { padding: 14px; border-radius: 11px; }
      .page-header { display: block; }
      table { display: block; overflow-x: auto; }
    }
  </style>
  <script>
    (function () {
      const key = "meowhome-theme";
      const root = document.documentElement;
      let stored = null;
      try { stored = localStorage.getItem(key); } catch (_) {}
      root.setAttribute("data-theme", stored === "light" ? "light" : "dark");
      document.addEventListener("DOMContentLoaded", function () {
        const toggle = document.getElementById("theme-toggle");
        if (!toggle) return;
        const sync = () => toggle.textContent = root.getAttribute("data-theme") === "dark" ? "Light" : "Dark";
        sync();
        toggle.addEventListener("click", function () {
          const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
          root.setAttribute("data-theme", next);
          try { localStorage.setItem(key, next); } catch (_) {}
          sync();
        });
      });
    })();
  </script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div><strong>MeowHome</strong><span>WSL hosting control plane</span></div>
      </div>
      <nav class="nav">
        <a href="/">Dashboard</a>
        <a href="/setup">Setup</a>
        <a href="/ftp">FTP & Domains</a>
        <a href="/vhosts">VHosts</a>
        <a href="/backup">Backups</a>
        <a href="/health">Health</a>
      </nav>
      <div class="sidebar-footer">
        <button id="theme-toggle" class="btn btn-ghost btn-sm" type="button">Light</button>
      </div>
    </aside>
    <main class="main">
      <div class="topbar"><span class="badge">local control plane</span></div>
      <div class="content">{% block content %}{% endblock %}</div>
    </main>
  </div>
</body>
</html>
