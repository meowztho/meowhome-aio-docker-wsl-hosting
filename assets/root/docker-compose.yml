services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: meowhome_apache
    environment:
      WIN_HOST_IP: ${WIN_HOST_IP:-127.0.0.1}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - "${MEOWHOME_HOST_PROJECT_DIR:-.}/htdocs:/var/www:rw"
      - "${MEOWHOME_HOST_PROJECT_DIR:-.}/apache/vhosts:/etc/apache2/sites-enabled:rw"
      - "${MEOWHOME_HOST_PROJECT_DIR:-.}/apache/snippets:/etc/apache2/snippets:ro"
      - "${MEOWHOME_HOST_PROJECT_DIR:-.}/letsencrypt:/etc/letsencrypt:ro"
    depends_on:
      - php
    restart: unless-stopped
#__MEOWHOME_WEB_EXTERNAL_NETWORKS__

  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: meowhome_php
    user: "${PUID}:${PGID}"
    volumes:
      - "${MEOWHOME_HOST_PROJECT_DIR:-.}/htdocs:/var/www:rw"
      - "${MEOWHOME_HOST_PROJECT_DIR:-.}/php/custom.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro"
    restart: unless-stopped

  mariadb:
    image: mariadb:10.11
    container_name: meowhome_db
    env_file: ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - "${MEOWHOME_HOST_PROJECT_DIR:-.}/db:/var/lib/mysql"
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    container_name: meowhome_pma
    env_file: ./.env
    environment:
      PMA_HOST: mariadb
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${PHPMYADMIN_BIND:-127.0.0.1}:${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      - mariadb
    restart: unless-stopped

  certbot:
    build:
      context: ./certbot
      dockerfile: Dockerfile
    container_name: meowhome_certbot
    env_file: ./.env
    environment:
      MEOWHOME_CONTROL_URL: http://control:8765
      MEOWHOME_CONTROL_TOKEN_FILE: /run/secrets/meowhome-certbot-control-token
    volumes:
      - "${MEOWHOME_HOST_PROJECT_DIR:-.}/letsencrypt:/etc/letsencrypt"
      - "${MEOWHOME_HOST_PROJECT_DIR:-.}/state:/state"
      - "${MEOWHOME_HOST_PROJECT_DIR:-.}/htdocs:/var/www:rw"
      - "${MEOWHOME_HOST_PROJECT_DIR:-.}/control/certbot.token:/run/secrets/meowhome-certbot-control-token:ro"
    networks:
      - default
      - control_net
    depends_on:
      - control
    restart: unless-stopped

  dns_updater:
    build:
      context: ./dns-updater
      dockerfile: Dockerfile
    container_name: meowhome_dns_updater
    env_file: ./.env
    volumes:
      - "${MEOWHOME_HOST_PROJECT_DIR:-.}/state:/state"
    restart: unless-stopped

  ftp:
    # Reap orphaned session processes outside vsftpd's own child accounting.
    init: true
    build:
      context: ./ftp
      dockerfile: Dockerfile
    container_name: meowhome_ftp
    env_file: ./.env
    volumes:
      - "${MEOWHOME_HOST_PROJECT_DIR:-.}/htdocs:/var/www:rw"
      - "${MEOWHOME_HOST_PROJECT_DIR:-.}/ftp/data:/etc/vsftpd:rw"
      - "${MEOWHOME_HOST_PROJECT_DIR:-.}/ftp/ssl:/etc/ssl/private:ro"
    ports:
      - "${FTP_BIND:-0.0.0.0}:${FTP_PORT:-21}:21"
      - "${FTP_BIND:-0.0.0.0}:${FTP_PASV_MIN}-${FTP_PASV_MAX}:${FTP_PASV_MIN}-${FTP_PASV_MAX}"
    restart: unless-stopped

  control:
    build:
      context: ./meowhome-control
      dockerfile: Dockerfile
    container_name: meowhome_control
    environment:
      MEOWHOME_PROJECT_DIR: /meowhome
      MEOWHOME_HOST_PROJECT_DIR: ${MEOWHOME_HOST_PROJECT_DIR:?MEOWHOME_HOST_PROJECT_DIR must be set}
      MEOWHOME_CONTROL_TOKEN_FILE: /run/secrets/meowhome-control-token
      MEOWHOME_CERTBOT_CONTROL_TOKEN_FILE: /run/secrets/meowhome-certbot-control-token
    volumes:
      - "${MEOWHOME_HOST_PROJECT_DIR:-.}:/meowhome:rw"
      - "${MEOWHOME_HOST_PROJECT_DIR:-.}/control/control.token:/run/secrets/meowhome-control-token:ro"
      - "${MEOWHOME_HOST_PROJECT_DIR:-.}/control/certbot.token:/run/secrets/meowhome-certbot-control-token:ro"
      - "${MEOWHOME_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock"
    networks:
      - control_net
    restart: unless-stopped

#__MEOWHOME_UI_SERVICE__

networks:
  control_net:
    internal: true
#__MEOWHOME_TOP_LEVEL_EXTERNAL_NETWORKS__
